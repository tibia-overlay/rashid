<body>
  <div class="container" id="container">
    <div id="icon"></div>
    <span id="text"></span>
  </div>
  <script>
    var text = document.getElementById("text");

    function getNpcLocation() {
      const now = new Date();
      const currentHour = now.getHours();

      const npcLocations = {
        1: "Svargrond",
        2: "Liberty Bay",
        3: "Port Hope",
        4: "Ankrahmun",
        5: "Darashia",
        6: "Edron",
        0: "Carlin"
      };

      let day = now.getDay();
      if (currentHour < 10) {
        day = (day - 1 + 7) % 7;
      }

      return npcLocations[day];
    }

    function updateNpcLocation() {
      text.textContent = getNpcLocation();
    }

    updateNpcLocation();
    setInterval(updateNpcLocation, 1000);

    document.addEventListener("DOMContentLoaded", function () {
      const searchParams = new URLSearchParams(window.location.search);

      // Icon
      if (searchParams.has("icon")) {
        const icon = Number(searchParams.get("icon"));
        if (icon === 0) {
          document.getElementById("icon").classList.add("hidden");
        }
      }

      // Color
      if (searchParams.has("color")) {
        const color = searchParams.get("color");
        document.getElementById("container").style.color = color;
      }

      // Font
      if (searchParams.has("font")) {
        const font = searchParams.get("font");
        document.getElementById("container").style.fontFamily = font;
      }

    });
  </script>
</body>
</html>
